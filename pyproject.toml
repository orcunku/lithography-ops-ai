[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lithoops-ai"
version = "1.0.0"
description = "EUV/DUV operations intelligence prototype: multi-agent + ML + MCP (synthetic data)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3",
    "fastapi>=0.110", "uvicorn[standard]>=0.29", "streamlit>=1.30",
    "plotly>=5.18", "mcp>=1.0", "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["lithoops*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
